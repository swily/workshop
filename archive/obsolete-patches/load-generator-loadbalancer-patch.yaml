apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-loadgenerator
  namespace: otel-demo
spec:
  template:
    spec:
      containers:
      - name: load-generator
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        env:
        # Point to external load balancer (will be updated with actual hostname after LB creation)
        - name: LOCUST_HOST
          value: "http://LOAD_BALANCER_HOSTNAME"
        # Reduced user count and spawn rate for optimized resource usage
        - name: LOCUST_USERS
          value: "5"  # Reduced from default 10
        - name: LOCUST_SPAWN_RATE
          value: "0.5"  # Slower spawn rate
        - name: LOCUST_HEADLESS
          value: "true"
        - name: LOCUST_AUTOSTART
          value: "true"
        # Disable browser traffic to reduce resource usage
        - name: LOCUST_BROWSER_TRAFFIC_ENABLED
          value: "false"
