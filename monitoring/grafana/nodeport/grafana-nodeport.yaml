apiVersion: v1
kind: Service
metadata:
  name: prometheus-grafana-nodeport
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: prometheus
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30860
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: prometheus
