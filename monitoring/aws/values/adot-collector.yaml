apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: otel-demo-cloudwatch
  namespace: aws-otel-eks
spec:
  mode: deployment
  serviceAccount: aws-otel-collector
  replicas: 1
  resources:
    limits:
      memory: 1Gi
      cpu: 500m
    requests:
      memory: 512Mi
      cpu: 200m
  config: |
    receivers:
      # OTLP receiver for application telemetry
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - "http://*"
                - "https://*"
      
      # Prometheus receiver to scrape otel-demo services
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-demo-services'
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names:
                      - otel-demo
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: true
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $1:$2
                  target_label: __address__
                - action: labelmap
                  regex: __meta_kubernetes_pod_label_(.+)
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: kubernetes_namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: kubernetes_pod_name
                - source_labels: [__meta_kubernetes_pod_container_name]
                  action: replace
                  target_label: kubernetes_container_name
      
      # Container insights receiver for infrastructure metrics
      awscontainerinsightreceiver:
        collection_interval: 60s
        container_orchestrator: eks
        add_service_as_attribute: true
        prefer_full_pod_name: false
        add_full_pod_name_metric_label: false

    processors:
      # Memory limiter
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      
      # Batch processor
      batch:
        timeout: 60s
        send_batch_size: 8192
      
      # Resource processor to add cluster info
      resource:
        attributes:
          - key: ClusterName
            value: "${CLUSTER_NAME}"
            action: upsert
          - key: aws.region
            value: "${AWS_REGION}"
            action: upsert
      
      # Kubernetes attributes processor
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
            - k8s.service.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

    exporters:
      # CloudWatch metrics exporter
      awscloudwatchmetrics:
        namespace: "OTel/Demo/Application"
        region: "${AWS_REGION}"
        dimension_rollup_option: "NoDimensionRollup"
        metric_declarations:
          - dimensions: [[service.name], [service.name, service.version]]
            metric_name_selectors:
              - ".*"
        
      # CloudWatch logs exporter
      awscloudwatchlogs:
        log_group_name: "/aws/otel-demo/application"
        log_stream_name: "{kubernetes_container_name}-{kubernetes_pod_name}"
        region: "${AWS_REGION}"
        
      # Container Insights exporter
      awsemf:
        namespace: "ContainerInsights"
        log_group_name: "/aws/containerinsights/${CLUSTER_NAME}/performance"
        log_stream_name: "{NodeName}"
        region: "${AWS_REGION}"
        dimension_rollup_option: "NoDimensionRollup"
        
      # Debug exporter for troubleshooting
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        metrics:
          receivers: [otlp, prometheus, awscontainerinsightreceiver]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [awscloudwatchmetrics, awsemf, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [awscloudwatchlogs, debug]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [debug]

  env:
    - name: CLUSTER_NAME
      value: "${CLUSTER_NAME}"
    - name: AWS_REGION
      value: "${AWS_REGION}"
    - name: KUBE_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
