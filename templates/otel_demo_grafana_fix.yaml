apiVersion: batch/v1
kind: Job
metadata:
  name: apply-otel-collector-config
  namespace: otel-demo
spec:
  template:
    spec:
      serviceAccountName: default
      containers:
      - name: kubectl
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          # Apply the enhanced collector config
          kubectl replace --force -f /config/collector-config.yaml
          
          # Restart the collector to apply the new config
          kubectl rollout restart deployment/otel-demo-otelcol -n otel-demo
          
          # Wait for the collector to be ready
          kubectl rollout status deployment/otel-demo-otelcol -n otel-demo --timeout=120s
          
          # Apply the enhanced Grafana dashboards
          kubectl replace --force -f /config/grafana-dashboards.yaml
        volumeMounts:
        - name: config-volume
          mountPath: /config
      restartPolicy: OnFailure
      volumes:
      - name: config-volume
        configMap:
          name: otel-demo-collector-config
---
