AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Synthetic Monitoring for ALB Warm-up'

Parameters:
  GrafanaURL:
    Type: String
    Default: "http://current-workshop-grafana.gremlinpoc.com"
    Description: "Grafana URL to monitor"
  
  FrontendURL:
    Type: String
    Default: "http://current-workshop-frontend.gremlinpoc.com"
    Description: "Frontend URL to monitor"

Resources:
  # IAM Role for Synthetics
  SyntheticsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CloudWatchSyntheticsRole-ALBWarmup
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/CloudWatchSyntheticsExecutionRolePolicy

  # S3 Bucket for Synthetics artifacts
  SyntheticsArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "synthetics-artifacts-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Grafana Health Check Canary
  GrafanaHealthCanary:
    Type: AWS::Synthetics::Canary
    Properties:
      Name: grafana-alb-warmup
      ArtifactS3Location: !Sub "${SyntheticsArtifactsBucket}/grafana-canary"
      ExecutionRoleArn: !GetAtt SyntheticsRole.Arn
      RuntimeVersion: syn-nodejs-puppeteer-6.2
      Schedule:
        Expression: "rate(5 minutes)"
        DurationInSeconds: 0
      RunConfig:
        TimeoutInSeconds: 60
        MemoryInMB: 960
      Code:
        Handler: pageLoadBlueprint.handler
        Script: !Sub |
          const synthetics = require('Synthetics');
          const log = require('SyntheticsLogger');
          
          const pageLoadBlueprint = async function () {
              // Configure synthetics
              let syntheticsConfig = synthetics.getConfiguration();
              syntheticsConfig.setConfig({
                  includeRequestHeaders: true,
                  includeResponseHeaders: true,
                  restrictedHeaders: [],
                  restrictedUrlParameters: []
              });
              
              let page = await synthetics.getPage();
              
              // Navigate to Grafana health endpoint
              const response = await page.goto("${GrafanaURL}/api/health", {
                  waitUntil: 'networkidle0',
                  timeout: 30000
              });
              
              // Log response
              log.info('Grafana health check response status: ' + response.status());
              
              // Verify response
              if (response.status() !== 200) {
                  throw new Error('Grafana health check failed with status: ' + response.status());
              }
              
              // Take screenshot for verification
              await synthetics.takeScreenshot('grafana-health', 'loaded');
          };
          
          exports.handler = async () => {
              return await synthetics.executeStep('grafanaHealthCheck', pageLoadBlueprint);
          };

  # Frontend Health Check Canary  
  FrontendHealthCanary:
    Type: AWS::Synthetics::Canary
    Properties:
      Name: frontend-alb-warmup
      ArtifactS3Location: !Sub "${SyntheticsArtifactsBucket}/frontend-canary"
      ExecutionRoleArn: !GetAtt SyntheticsRole.Arn
      RuntimeVersion: syn-nodejs-puppeteer-6.2
      Schedule:
        Expression: "rate(5 minutes)"
        DurationInSeconds: 0
      RunConfig:
        TimeoutInSeconds: 60
        MemoryInMB: 960
      Code:
        Handler: pageLoadBlueprint.handler
        Script: !Sub |
          const synthetics = require('Synthetics');
          const log = require('SyntheticsLogger');
          
          const pageLoadBlueprint = async function () {
              let syntheticsConfig = synthetics.getConfiguration();
              syntheticsConfig.setConfig({
                  includeRequestHeaders: true,
                  includeResponseHeaders: true,
                  restrictedHeaders: [],
                  restrictedUrlParameters: []
              });
              
              let page = await synthetics.getPage();
              
              // Navigate to Frontend
              const response = await page.goto("${FrontendURL}", {
                  waitUntil: 'networkidle0',
                  timeout: 30000
              });
              
              log.info('Frontend response status: ' + response.status());
              
              if (response.status() !== 200) {
                  throw new Error('Frontend check failed with status: ' + response.status());
              }
              
              await synthetics.takeScreenshot('frontend', 'loaded');
          };
          
          exports.handler = async () => {
              return await synthetics.executeStep('frontendHealthCheck', pageLoadBlueprint);
          };

  # CloudWatch Alarms
  GrafanaCanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "Grafana-ALB-Warmup-Failed"
      AlarmDescription: "Grafana synthetic monitoring failed"
      MetricName: "Failed"
      Namespace: "CloudWatchSynthetics"
      Statistic: "Sum"
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: "CanaryName"
          Value: !Ref GrafanaHealthCanary

  FrontendCanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "Frontend-ALB-Warmup-Failed"
      AlarmDescription: "Frontend synthetic monitoring failed"
      MetricName: "Failed"
      Namespace: "CloudWatchSynthetics"
      Statistic: "Sum"
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: "CanaryName"
          Value: !Ref FrontendHealthCanary

Outputs:
  GrafanaCanaryName:
    Description: "Grafana Canary Name"
    Value: !Ref GrafanaHealthCanary
    
  FrontendCanaryName:
    Description: "Frontend Canary Name"
    Value: !Ref FrontendHealthCanary
    
  S3BucketName:
    Description: "S3 Bucket for Synthetics Artifacts"
    Value: !Ref SyntheticsArtifactsBucket
    
  EstimatedMonthlyCost:
    Description: "Estimated monthly cost in USD"
    Value: "~$17.28 (2 canaries × 8640 runs/month × $0.0012/run)"
